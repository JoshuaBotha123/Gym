<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e4572e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Phase 2">
<title>Athlete Build · Phase 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f3ef;--card:#ffffff;--ink:#16181d;--muted:#6b7079;--line:#e5e1d9;
  --accent:#e4572e;--accent-ink:#fff;--accent-soft:#fde8e0;
  --good:#1d8a5a;--good-soft:#e0f2e8;--chip:#ece8e1;--shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.04);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101216;--card:#191c22;--ink:#f1f1ef;--muted:#9aa0a9;--line:#2a2e36;
  --accent:#ff6a3d;--accent-ink:#1a0d07;--accent-soft:#3a2119;
  --good:#3ccf8e;--good-soft:#15301f;--chip:#23272f;--shadow:none;
}}
:root[data-theme="dark"]{
  --bg:#101216;--card:#191c22;--ink:#f1f1ef;--muted:#9aa0a9;--line:#2a2e36;
  --accent:#ff6a3d;--accent-ink:#1a0d07;--accent-soft:#3a2119;
  --good:#3ccf8e;--good-soft:#15301f;--chip:#23272f;--shadow:none;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
h1,h2,h3,.cond{font-family:"Barlow Condensed",Inter,sans-serif;letter-spacing:.01em;margin:0}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 110px}
header.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 0 8px;border-bottom:1px solid var(--line)}
.top .wrap{padding-bottom:0}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:10px}
.brand h1{font-size:26px;font-weight:800;text-transform:uppercase}
.brand h1 span{color:var(--accent)}
.brand small{color:var(--muted);font-size:12px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:1 1 0;min-width:0;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;font-weight:600;font-size:13px;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .pct{opacity:.6;font-weight:500;margin-left:4px}
.days{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:14px 0}
.dbtn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 2px 7px;text-align:center;position:relative;box-shadow:var(--shadow)}
.dbtn b{display:block;font-family:"Barlow Condensed";font-size:20px;line-height:1}
.dbtn span{font-size:11px;color:var(--muted)}
.dbtn.on{border-color:var(--accent);background:var(--accent-soft)}
.dbtn.done::after{content:"✓";position:absolute;top:-6px;right:-4px;background:var(--good);color:#fff;width:18px;height:18px;border-radius:50%;font-size:11px;line-height:18px;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0;box-shadow:var(--shadow)}
.weekcard{background:var(--ink);color:var(--bg);border:none}
.weekcard .k{font-size:12px;text-transform:uppercase;letter-spacing:.08em;opacity:.7}
.weekcard h2{font-size:24px;text-transform:uppercase;margin:2px 0 4px}
.weekcard p{margin:0;font-size:14px;opacity:.85}
.dayhead h2{font-size:30px;text-transform:uppercase;line-height:1}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{background:var(--chip);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600}
.tag.a{background:var(--accent-soft);color:var(--accent)}
.sect{display:flex;align-items:center;justify-content:space-between;margin:20px 2px 4px}
.sect h3{font-size:18px;text-transform:uppercase;color:var(--muted)}
.ex{padding:12px 14px}
.ex.done{border-color:var(--good);background:linear-gradient(0deg,var(--good-soft),var(--good-soft)) padding-box}
.ex-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ex-name{font-weight:700;font-size:16px}
.rx{margin-top:2px;font-size:14px}
.rx b{color:var(--accent)}
.rx .r{color:var(--muted)}
.cue{color:var(--muted);font-size:13px;margin-top:6px}
.prev{font-size:12px;margin-top:6px;color:var(--muted);font-style:italic}
.sets{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.set{min-width:44px;height:40px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-weight:700;font-size:14px;padding:0 10px}
.set.on{background:var(--good);border-color:var(--good);color:#fff}
.mini{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:0 10px;height:40px;font-size:13px;font-weight:600;color:var(--muted)}
.field{width:100%;margin-top:10px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 11px;font-size:14px}
textarea.field{min-height:70px;resize:vertical}
.list{margin:6px 0 0;padding-left:18px;color:var(--muted);font-size:14px}
.list li{margin:2px 0}
.checkrow{display:flex;align-items:center;gap:10px;font-weight:600}
.checkrow input{width:22px;height:22px;accent-color:var(--good)}
.btn{display:block;width:100%;border:none;border-radius:14px;padding:14px;font-weight:700;font-size:16px;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--chip);color:var(--ink)}
.btn.good{background:var(--good);color:#fff}
.btn+.btn{margin-top:8px}
.row{display:flex;gap:8px}
.row>*{flex:1}
.lbl{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-top:12px;display:block}
.rpe{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-top:6px}
.rpe button{height:36px;border-radius:8px;border:1px solid var(--line);background:var(--bg);font-weight:700;font-size:13px;padding:0}
.rpe button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.seg{display:flex;gap:6px;margin-top:6px}
.seg button{flex:1;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-weight:600;font-size:13px}
.seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.big{font-family:"Barlow Condensed";font-weight:800;font-size:56px;line-height:1}
.big small{font-size:22px;color:var(--muted);font-weight:700}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat .card{margin:0;text-align:center;padding:12px 6px}
.stat b{display:block;font-family:"Barlow Condensed";font-size:30px;line-height:1}
.stat span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.bar{height:10px;background:var(--chip);border-radius:999px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px}
.grid{display:grid;grid-template-columns:52px repeat(5,1fr);gap:6px;align-items:center;font-size:12px}
.grid .c{height:34px;border-radius:8px;background:var(--chip);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--muted)}
.grid .c.part{background:var(--accent-soft);color:var(--accent)}
.grid .c.ok{background:var(--good);color:#fff}
.grid .h{text-align:center;color:var(--muted);font-weight:600}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase}
.runbars{display:flex;align-items:flex-end;gap:10px;height:120px;margin-top:10px}
.runbars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11px;color:var(--muted)}
.runbars i{display:block;width:100%;background:var(--accent);border-radius:8px 8px 3px 3px;min-height:4px}
.runbars i.empty{background:var(--chip)}
.prose h3{font-size:20px;text-transform:uppercase;margin:4px 0 6px}
.prose p,.prose li{font-size:14px;color:var(--ink)}
.prose ul{padding-left:18px;margin:6px 0}
.muted{color:var(--muted)}
nav.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav.tabbar .in{display:flex;max-width:560px;width:100%}
nav.tabbar button{flex:1;border:none;background:none;padding:10px 0 12px;font-weight:700;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;text-transform:uppercase;letter-spacing:.05em}
nav.tabbar button svg{width:22px;height:22px}
nav.tabbar button.on{color:var(--accent)}
/* Timer */
.timer{position:fixed;inset:0;z-index:50;background:#0d0f13;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;transition:background .3s}
.timer.work{background:#c2401c}
.timer.rest{background:#14532d}
.timer.hidden{display:none}
.timer .ph{font-size:14px;text-transform:uppercase;letter-spacing:.15em;opacity:.8}
.timer .nm{font-family:"Barlow Condensed";font-size:44px;font-weight:800;text-transform:uppercase;line-height:1;margin:8px 0}
.timer .ct{font-family:"Barlow Condensed";font-size:min(42vw,220px);font-weight:800;line-height:.9;font-variant-numeric:tabular-nums}
.timer .nx{opacity:.8;margin-top:10px;font-size:15px}
.timer .rd{margin-top:4px;opacity:.7;font-size:13px}
.timer .tb{width:100%;max-width:420px;height:8px;background:rgba(255,255,255,.2);border-radius:999px;margin-top:22px;overflow:hidden}
.timer .tb i{display:block;height:100%;background:#fff;width:0}
.timer .ctrl{display:flex;gap:10px;margin-top:26px;width:100%;max-width:420px}
.timer .ctrl button{flex:1;border:none;border-radius:14px;padding:16px;font-weight:700;font-size:16px;background:rgba(255,255,255,.16);color:#fff}
.timer .ctrl button.p{background:#fff;color:#111}
.shbanner{background:var(--accent-soft);border:1px solid var(--accent);color:var(--ink);font-size:13px}
.shbanner b{color:var(--accent)}
.ex.sh{border-left:4px solid var(--accent)}
.shl{display:inline-block;min-width:22px;padding:2px 6px;border-radius:6px;font-size:11px;font-weight:700}
.shl.Great,.shl.Fine{background:var(--good-soft);color:var(--good)}
.shl.Tight{background:var(--accent-soft);color:var(--accent)}
.shl.Sore{background:var(--accent);color:var(--accent-ink)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:60;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand"><h1>Phase <span>2</span></h1><small id="hello"></small></div>
  <div class="chips" id="weeks"></div>
</div></header>
<main class="wrap" id="app"></main>
<nav class="tabbar"><div class="in">
  <button data-tab="train" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg>Train</button>
  <button data-tab="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Progress</button>
  <button data-tab="guide"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>Guide</button>
</div></nav>

<div class="timer hidden" id="timer">
  <div class="ph" id="tPh">Get ready</div>
  <div class="nm" id="tNm"></div>
  <div class="ct" id="tCt">0</div>
  <div class="nx" id="tNx"></div>
  <div class="rd" id="tRd"></div>
  <div class="tb"><i id="tBar"></i></div>
  <div class="ctrl">
    <button id="tPause" class="p">Pause</button>
    <button id="tSkip">Skip</button>
    <button id="tStop">End</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ================= PROGRAM DATA — PHASE 2 (Weeks 5–8) ================= */
const WEEKS=[
 {n:1,label:5,theme:'Re-Load',note:'New, harder exercises. Learn them first — clean reps, 2 left in the tank. Shoulder work light and strict.'},
 {n:2,label:6,theme:'Build',note:'More reps and sets on the same moves. Keep shoulder exercises slow and controlled — quality over weight.'},
 {n:3,label:7,theme:'Power',note:'Heavier holds, 3-second lowering and more explosive jumps. Rest fully between sets so every rep is sharp.'},
 {n:4,label:8,theme:'Peak & Test',note:'Biggest week of the program. Redo the fitness tests on the Progress tab and compare with Week 5.'}
];
const E=(id,name,cue,w,rest,extra={})=>({id,name,cue,w,rest,...extra});

const SHOULDER_A=[
  E('s1a','Band External Rotation','Elbow pinned to your side (rolled towel under the arm), rotate your forearm out against the band. Slow, no shrugging.',[[2,'12 / arm'],[2,'15 / arm'],[3,'12 / arm · 2s hold'],[3,'15 / arm · 2s hold']],20,{sh:true}),
  E('s1b','Scapular Push-Ups','Hands on the bench, arms straight. Let your chest sink between your shoulder blades, then push the bench away. Arms never bend.',[[2,'10'],[2,'12'],[3,'12'],[3,'15']],20,{sh:true})
];
const SHOULDER_B=[
  E('s5a','Band Face Pulls','Band anchored at head height (pole, gate or door). Pull towards your face, elbows high, finish with thumbs pointing back.',[[2,'12'],[2,'15'],[3,'15'],[3,'15 · 2s hold']],20,{sh:true}),
  E('s5b','Prone Y-Raises','Lie face down on the bench or mat, thumbs up, lift arms into a Y. No weight — squeeze the lower shoulder blades.',[[2,'10'],[2,'12'],[3,'10 · 2s hold'],[3,'12 · 2s hold']],20,{sh:true})
];

const DAYS=[
{ id:1,short:'Legs',title:'Quads, Glutes & Abs',type:'strength',dur:'~45–50 min',tags:['Quads','Glutes','Abs','Shoulder prep'],
  warm:['2 min high knees / jog on the spot','10 bodyweight squats','10 walking lunges (5 per leg)','10 glute bridges','10 lateral lunges (5 per side)','10 arm circles each way'],
  blocks:[
   {title:'Shoulder prep (5 min)',sh:true,ex:SHOULDER_A},
   {title:'Quads & Glutes',ex:[
    E('p1a','1½-Rep Goblet Squat','12.5kg at your chest. All the way down, halfway up, back down, then stand tall = 1 rep. Burns — that’s the point.',[[3,'8'],[3,'10'],[4,'10'],[4,'12']],60),
    E('p1b','Step Jumps + Stick','Jump onto the step, land quiet and freeze for 2 seconds, step down. Every rep explosive — this is power, not cardio.',[[3,'6'],[4,'6'],[4,'8'],[5,'6']],60),
    E('p1c','Deficit Bulgarian Split Squat','Front foot on the step, back foot on the bench — deeper than Phase 1. Hold 12.5kg goblet.',[[3,'8 / leg'],[3,'10 / leg'],[4,'8 / leg · 3s down'],[4,'10 / leg · 3s down']],60),
    E('p1d','Single-Leg Hip Thrust','Upper back on the bench, one foot planted, other knee up. Dumbbell on the working hip. Squeeze 1s at the top.',[[3,'10 / leg · 4kg'],[3,'12 / leg · 4kg'],[4,'10 / leg · 12.5kg'],[4,'12 / leg · 12.5kg']],45),
    E('p1e','Lateral Lunge','Big step to the side, sit back into that hip, other leg straight. Builds hockey-strong hips and inner thighs.',[[3,'8 / side'],[3,'10 / side · 4kg'],[3,'10 / side · 12.5kg goblet'],[4,'10 / side · 12.5kg goblet']],45),
    E('p1f','Banded Wall Sit','Band above knees, push knees out against it, thighs parallel to the floor.',[[2,'40s'],[3,'45s'],[3,'60s'],[3,'60s · hug 10kg ball']],30,{timed:true})
   ]},
   {title:'Abs',ex:[
    E('p1g','Long-Lever Dead Bug','Arms straight overhead, lower back glued down, slowly extend opposite arm and leg all the way.',[[3,'10 / side'],[3,'12 / side · 3kg'],[3,'12 / side · 4kg'],[3,'15 / side · 4kg']],30),
    E('p1h','Med Ball Sit-Up','Hug the 10kg ball at your chest, sit up tall, lower slowly (3 seconds).',[[3,'12'],[3,'15'],[4,'12'],[4,'15']],30),
    E('p1i','Plank with Alternating Reach','Forearm plank, reach one arm forward without your hips moving. Great for shoulder stability too.',[[3,'30s'],[3,'40s'],[3,'45s'],[3,'60s']],30,{timed:true})
   ]}
  ],
  cool:['Quad stretch 30s / leg','Pigeon glute stretch 30s / side','Hip flexor lunge stretch 30s / side','Child’s pose with arms long 30s']
},
{ id:2,short:'HIIT',title:'Athletic HIIT Circuit',type:'hiit',dur:'~40 min',tags:['Cardio','Fat burn','Speed','Agility'],
  warm:['1 min jog (garden lengths)','10 arm circles each way','10 band pull-aparts','10 bodyweight squats','10 lateral shuffles each way','2 × 10m build-up sprints'],
  rounds:3,work:45,rest:15,roundRest:60,
  ex:[
   {id:'h1',name:'Shuttle Sprints (10m)',cue:'Sprint, touch the line with your hand, turn and go. Stay low through the turn.'},
   {id:'h2',name:'Burpee Broad Jumps',cue:'Burpee, then jump forward as far as you can. Turn around at the end of the garden.'},
   {id:'h3',name:'Lateral Shuffle (10m)',cue:'Low hockey stance, shuffle side to side the length of the garden. Don’t cross your feet.'},
   {id:'h4',name:'Tuck Jumps',cue:'Jump and pull knees to chest, land soft and bounce straight into the next one.'},
   {id:'h5',name:'Bear Crawl',cue:'Knees an inch off the ground, crawl forward and back. Back flat, slow and controlled — shoulder stability.'},
   {id:'h6',name:'Med Ball Rotational Slams',cue:'10kg ball up over one shoulder, slam it down beside the opposite foot. Alternate sides.'},
   {id:'h7',name:'Fast-Feet Step-Ups',cue:'Quick alternating taps up onto the step, sprinter arms, stay light.'},
   {id:'h8',name:'Cross-Body Mountain Climbers',cue:'Drive each knee towards the opposite elbow, hips low, hands under shoulders.'}
  ],
  cool:['Walk 2 min until breathing settles','Hamstring stretch 30s / leg','Quad stretch 30s / leg','Chest + shoulder doorway stretch 30s']
},
{ id:3,short:'Upper',title:'Shoulders, Upper Body & Abs',type:'strength',dur:'~50 min',tags:['Shoulder health','Back','Arms','Abs'],
  shNote:true,
  warm:['30 arm circles (small to big, both ways)','10 band pull-aparts (light)','10 cat-cows','10 wall slides (back against wall, slide arms up)','10 incline push-ups on the bench'],
  blocks:[
   {title:'Shoulder strength (do these first)',sh:true,ex:[
    E('p3a','Band External Rotation','Elbow pinned to your side with a towel under the arm. Rotate out slowly, 2 seconds back in.',[[3,'12 / arm'],[3,'15 / arm'],[3,'15 / arm · 2s hold'],[3,'20 / arm']],20,{sh:true}),
    E('p3b','Band Face Pulls','Band at head height, pull to your face, elbows high, thumbs back. Squeeze between shoulder blades.',[[3,'15'],[3,'15'],[3,'20'],[4,'20']],30,{sh:true}),
    E('p3c','Y-T-W Raises','Face down on the bench. Arms into a Y, then a T, then a W = 1 rep. Thumbs up, no weight, no shrugging.',[[2,'6'],[3,'6'],[3,'6 · 2s hold each'],[3,'8 · 2s hold each']],30,{sh:true})
   ]},
   {title:'Upper Body',ex:[
    E('p3d','Push-Ups','On the floor, body in one line, elbows at about 45° (not flared). Drop to knees for the last reps if needed.',[[3,'8'],[3,'10'],[4,'8 · 3s down'],[4,'10 · 3s down']],60),
    E('p3e','Single-Arm Row','12.5kg, hand and knee on the bench. Pull to your hip, squeeze the shoulder blade back and down.',[[3,'12 / arm'],[4,'12 / arm'],[4,'10 / arm · 2s squeeze'],[4,'12 / arm · 2s squeeze']],45),
    E('p3f','Half-Kneeling Single-Arm Press','4kg. Kneel on one knee, squeeze that glute, press up slightly in front of your head. Stop if it pinches.',[[3,'10 / arm'],[3,'12 / arm'],[3,'10 / arm · 3s down'],[4,'10 / arm · 3s down']],45),
    E('p3g','Lateral Raises','3kg, one arm at a time. Lift to shoulder height only, slight bend in the elbow, lower slowly.',[[3,'10 / arm'],[3,'12 / arm'],[3,'15 / arm'],[4,'12 / arm · 2s pause']],30),
    E('p3h','Tricep Kickbacks','Hinge forward, elbow tucked high by your ribs, straighten the arm back and squeeze.',[[3,'12 / arm · 3kg'],[3,'12 / arm · 4kg'],[3,'15 / arm · 4kg'],[4,'12 / arm · 4kg']],30),
    E('p3i','Hammer Curls','4kg, thumb facing up, elbows pinned, slow on the way down.',[[3,'10 / arm'],[3,'12 / arm'],[3,'12 / arm · 3s down'],[4,'12 / arm']],30)
   ]},
   {title:'Abs',ex:[
    E('p3j','Bear Hold','Hands under shoulders, knees an inch off the floor, back flat. Push the floor away.',[[3,'20s'],[3,'30s'],[3,'40s'],[3,'45s']],30,{timed:true,sh:true}),
    E('p3k','Hollow Rocks','Hollow body position, rock gently from shoulders to hips without breaking the shape.',[[3,'10'],[3,'12'],[3,'15'],[4,'15']],30),
    E('p3l','Copenhagen Side Plank','On your forearm, top leg’s knee on the bench, bottom leg hanging. Hockey-player inner-thigh strength.',[[2,'15s / side'],[3,'20s / side'],[3,'25s / side'],[3,'30s / side']],20,{timed:true})
   ]}
  ],
  cool:['Doorway chest stretch 30s','Cross-body shoulder stretch 30s / arm','Thread the needle 30s / side','Child’s pose with arms long 30s']
},
{ id:4,short:'Run',title:'Long Run',type:'run',dur:'Distance goal',tags:['Endurance','Fat burn'],

const TESTS=[['pushups','Max push-ups in 1 min','reps'],['plank','Max forearm plank','sec'],['wallsit','Max wall sit','sec'],['shuttle','5 × 10m shuttle (50m)','sec'],['squat60','60 squats','time'],['er','Band external rotations (to fatigue, weaker arm)','reps']];
const lbl=w=>WEEKS[w-1].label;

/* ================= STATE ================= */
const KEY='athleteBuild.phase2.v1';
let S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.w)S={name:'',w:{},base:{},tests:{s:{},e:{}},ui:{week:1,day:1,tab:'train'}};
S.base=S.base||{};S.tests=S.tests||{s:{},e:{}};
if(!S.name){try{const o=JSON.parse(localStorage.getItem('athleteBuild.v1'));if(o&&o.name)S.name=o.name;if(o&&o.theme&&!S.theme)S.theme=o.theme}catch(e){}}
S.ui=S.ui||{week:1,day:1,tab:'train'};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const W=w=>(S.w[w]=S.w[w]||{d:{},c:{}});
const D=(w,d)=>{const x=W(w);return x.d[d]=x.d[d]||{s:{},l:{},n:'',warm:false,cool:false}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s);
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),1800)}

/* counts */
function setsFor(day,w){
  if(day.type==='hiit')return day.ex.map(e=>({id:e.id,n:day.rounds}));
  if(day.type==='run')return [{id:'run',n:1}];
  return day.blocks.flatMap(b=>b.ex.map(e=>({id:e.id,n:e.w[w-1][0]})));
}
function dayProgress(day,w){
  const r=D(w,day.id);let tot=0,done=0;
  setsFor(day,w).forEach(x=>{tot+=x.n;const a=r.s[x.id]||[];for(let i=0;i<x.n;i++)if(a[i])done++});
  if(day.type==='run'){tot=1;done=r.done?1:0}
  return {tot,done,pct:tot?done/tot:0};
}
function weekPct(w){let t=0,d=0;DAYS.forEach(day=>{const p=dayProgress(day,w);t+=p.tot;d+=p.done});return t?Math.round(d/t*100):0}

/* ================= RENDER ================= */
function renderWeeks(){
  $('#weeks').innerHTML=WEEKS.map(w=>`<button class="chip ${S.ui.week===w.n?'on':''}" data-week="${w.n}">Wk ${w.label}<span class="pct">${weekPct(w.n)}%</span></button>`).join('');
  $('#hello').textContent=S.name?`Let’s go, ${S.name}`:'Weeks 5–8';
}
function render(){
  renderWeeks();
  document.querySelectorAll('nav.tabbar button').forEach(b=>b.classList.toggle('on',b.dataset.tab===S.ui.tab));
  $('#weeks').style.display=S.ui.tab==='guide'?'none':'flex';
  const app=$('#app');
  app.innerHTML=S.ui.tab==='train'?trainView():S.ui.tab==='progress'?progressView():guideView();
}
function trainView(){
  const w=S.ui.week,wk=WEEKS[w-1],day=DAYS[S.ui.day-1],r=D(w,day.id);
  let h=`<div class="days">${DAYS.map(d=>{const rr=D(w,d.id);return `<button class="dbtn ${d.id===day.id?'on':''} ${rr.done?'done':''}" data-day="${d.id}"><b>D${d.id}</b><span>${d.short}</span></button>`}).join('')}</div>`;
  h+=`<div class="card weekcard"><div class="k">Phase 2 · Week ${wk.label} of 8</div><h2>${wk.theme}</h2><p>${day.type==='hiit'?'New Phase 2 circuit — stays the same all 4 weeks. Beat your own effort each week.':wk.note}</p></div>`;
  if(day.shNote)h+=`<div class="card shbanner"><b>Shoulder day.</b> This session follows the doctor’s advice to strengthen her shoulders. Light weights, slow reps, no pain. If the doctor or a physio gave specific exercises or limits, those come first.</div>`;
  h+=`<div class="card dayhead"><div class="muted cond" style="font-size:15px;text-transform:uppercase;letter-spacing:.08em">Day ${day.id} · ${day.dur}</div><h2>${day.title}</h2><div class="tags">${day.tags.map((t,i)=>`<span class="tag ${i===0?'a':''}">${t}</span>`).join('')}</div></div>`;
  h+=listCard('Warm-up','warm',day.warm,r.warm);
  if(day.type==='strength')h+=strengthBody(day,w,r);
  if(day.type==='hiit')h+=hiitBody(day,w,r);
  if(day.type==='run')h+=runBody(day,w,r);
  h+=listCard('Cool-down','cool',day.cool,r.cool);
  h+=sessionLog(day,w,r);
  return h;
}
function listCard(title,key,items,checked){
  return `<div class="sect"><h3>${title}</h3></div><div class="card"><label class="checkrow"><input type="checkbox" data-act="flag" data-k="${key}" ${checked?'checked':''}> ${title} done</label><ul class="list">${items.map(i=>`<li>${i}</li>`).join('')}</ul></div>`;
}
function bubbles(id,n,arr){let s='';for(let i=0;i<n;i++)s+=`<button class="set ${arr[i]?'on':''}" data-act="set" data-id="${id}" data-i="${i}">${arr[i]?'✓':i+1}</button>`;return s}
function strengthBody(day,w,r){
  let h='';
  day.blocks.forEach(b=>{
    h+=`<div class="sect"><h3>${b.title}</h3></div>${b.sh&&b.ex.length<3?`<p class="muted" style="font-size:13px;margin:0 2px 6px">Doctor’s orders — keep the shoulders strong. Light band, slow and strict.</p>`:''}`;
    b.ex.forEach(e=>{
      const [n,reps]=e.w[w-1],arr=r.s[e.id]||[],all=[...Array(n)].every((_,i)=>arr[i]);
      const prevW=w>1?D(w-1,day.id).l[e.id]:'';const prevLbl=w>1?`Week ${lbl(w-1)}`:'';
      h+=`<div class="card ex ${e.sh?'sh':''} ${all?'done':''}">
        <div class="ex-top"><div><div class="ex-name">${e.name}</div>
        <div class="rx"><b>${n>1?n+' × ':''}${reps}</b>${e.rest?` <span class="r">· rest ${e.rest}s</span>`:''}</div></div></div>
        <div class="cue">${e.cue}</div>
        ${prevW?`<div class="prev">${prevLbl}: ${esc(prevW)}</div>`:''}
        <div class="sets">${bubbles(e.id,n,arr)}
          ${e.timed?`<button class="mini" data-act="hold" data-s="${parseInt(reps)}">${parseInt(reps)}s timer</button>`:''}
          ${e.rest?`<button class="mini" data-act="rest" data-s="${e.rest}">Rest ${e.rest}s</button>`:''}</div>
        ${e.finisher
          ?`<div class="row"><input class="field" placeholder="Time (e.g. 2:15)" data-act="load" data-id="${e.id}" value="${esc(r.l[e.id])}"><input class="field" inputmode="numeric" placeholder="Breaks taken" data-act="fin" data-id="breaks" value="${esc(r.breaks)}"></div>`
          :`<input class="field" placeholder="Weight / reps / how it felt" data-act="load" data-id="${e.id}" value="${esc(r.l[e.id])}">`}
      </div>`;
    });
  });
  return h;
}
function hiitBody(day,w,r){
  let h=`<div class="sect"><h3>Circuit</h3></div><div class="card">
    <div class="big">${day.rounds}<small> rounds × 8 exercises</small></div>
    <p class="muted" style="margin:6px 0 12px">${day.work}s on · ${day.rest}s off · ${day.roundRest}s between rounds. The timer calls out every exercise and ticks off rounds for you.</p>
    <button class="btn" data-act="hiit">Start HIIT timer</button></div>`;
  day.ex.forEach((e,i)=>{
    const arr=r.s[e.id]||[],all=[0,1,2].every(k=>arr[k]);
    h+=`<div class="card ex ${all?'done':''}"><div class="ex-name">${i+1}. ${e.name}</div>
      <div class="rx"><b>${day.work}s</b> <span class="r">· ${day.rest}s rest</span></div>
      <div class="cue">${e.cue}</div>
      <div class="sets">${bubbles(e.id,day.rounds,arr).replace(/>(\d)</g,'>R$1<')}</div></div>`;
  });
  h+=`<div class="card"><span class="lbl" style="margin-top:0">Total burpees / sprints / notes</span><input class="field" placeholder="e.g. 14 burpees per round" data-act="load" data-id="hiitnote" value="${esc(r.l.hiitnote)}"></div>`;
  return h;
}
function runBody(day,w,r){
  const km=day.dist[w-1];
  const pace=paceOf(r.min,r.sec,km);
  const prev=w>1?D(w-1,4):null;
  return `<div class="sect"><h3>Run</h3></div><div class="card">
    <div class="big">${km}<small> km</small></div>
    <p class="muted" style="margin:6px 0 0">Goal: run the full ${km} km <b>without walking</b>. ${day.tip[w-1]} If you need to, slow right down — but keep running.</p>
    ${w===1&&S.base.run?`<div class="prev">Phase 1 best: 4 km in ${esc(S.base.run)}</div>`:''}${prev&&prev.min?`<div class="prev">Week ${lbl(w-1)}: ${D(w-1,4).min}:${String(prev.sec||0).padStart(2,'0')} for ${day.dist[w-2]} km (${paceOf(prev.min,prev.sec,day.dist[w-2])||'-'} /km)</div>`:''}
    <span class="lbl">Your time</span>
    <div class="row"><input class="field" style="margin-top:6px" inputmode="numeric" placeholder="Minutes" data-act="run" data-k="min" value="${esc(r.min)}"><input class="field" style="margin-top:6px" inputmode="numeric" placeholder="Seconds" data-act="run" data-k="sec" value="${esc(r.sec)}"></div>
    <div class="muted" style="margin-top:8px">Pace: <b id="pace" style="color:var(--ink)">${pace?pace+' /km':'—'}</b></div>
    <label class="checkrow" style="margin-top:12px"><input type="checkbox" data-act="runflag" data-k="nowalk" ${r.nowalk?'checked':''}> Ran the whole way without walking</label>
    <span class="lbl">Route / notes</span>
    <input class="field" style="margin-top:6px" placeholder="Where you ran, weather, how legs felt" data-act="load" data-id="runnote" value="${esc(r.l.runnote)}">
  </div>`;
}
function paceOf(m,s,km){m=+m||0;s=+s||0;const t=m*60+s;if(!t)return '';const p=t/km;return Math.floor(p/60)+':'+String(Math.round(p%60)).padStart(2,'0')}
function sessionLog(day,w,r){
  const p=dayProgress(day,w);
  return `<div class="sect"><h3>Session log</h3></div><div class="card">
    ${day.type!=='run'?`<div class="muted" style="font-size:13px">${p.done} / ${p.tot} sets ticked</div><div class="bar"><i style="width:${p.pct*100}%"></i></div>`:''}
    <span class="lbl">Effort (1 = easy, 10 = max)</span>
    <div class="rpe">${[...Array(10)].map((_,i)=>`<button class="${r.rpe===i+1?'on':''}" data-act="rpe" data-v="${i+1}">${i+1}</button>`).join('')}</div>
    <span class="lbl">Energy</span>
    <div class="seg">${['Low','Okay','Good','Great'].map(v=>`<button class="${r.energy===v?'on':''}" data-act="energy" data-v="${v}">${v}</button>`).join('')}</div>
    <span class="lbl">Shoulders today</span>
    <div class="seg">${['Great','Fine','Tight','Sore'].map(v=>`<button class="${r.sh===v?'on':''}" data-act="shfeel" data-v="${v}">${v}</button>`).join('')}</div>
    <span class="lbl">Notes</span>
    <textarea class="field" style="margin-top:6px" placeholder="Anything to remember — sore spots, PBs, what to push next week" data-act="note">${esc(r.n)}</textarea>
    <div style="margin-top:12px"><button class="btn ${r.done?'good':''}" data-act="done">${r.done?'✓ Completed'+(r.date?' · '+r.date:''):'Mark session complete'}</button></div>
  </div>`;
}

function progressView(){
  const total=DAYS.length*4;let done=0,sets=0;
  for(let w=1;w<=4;w++)DAYS.forEach(d=>{const r=D(w,d.id);if(r.done)done++;Object.values(r.s).forEach(a=>a.forEach(x=>{if(x)sets++}))});
  // streak in sessions done in order
  let h=`<div class="card" style="margin-top:14px"><div class="muted cond" style="text-transform:uppercase;letter-spacing:.08em">Program complete</div>
    <div class="big">${Math.round(done/total*100)}<small>%</small></div><div class="bar"><i style="width:${done/total*100}%"></i></div></div>
    <div class="stat"><div class="card"><b>${done}</b><span>Sessions</span></div><div class="card"><b>${sets}</b><span>Sets done</span></div><div class="card"><b>${runKm()}</b><span>km run</span></div></div>`;

  </div><p class="muted" style="font-size:12px;margin:10px 0 0">Tap any square to jump to that session.</p></div>`;
  // runs
  const runs=[1,2,3,4].map(w=>{const r=D(w,4);const t=(+r.min||0)*60+(+r.sec||0);return {w,km:DAYS[3].dist[w-1],t,r}});

    <p class="muted" style="font-size:12px;margin:8px 0 0">Pace (min/km) shown above each bar — distance goes up every week, so holding the same pace is a win.${S.base.run?` Phase 1: 4 km in ${esc(S.base.run)}.`:''}</p></div>`;
  // finisher
  h+=`<div class="sect"><h3>Squat ladder finisher</h3></div><div class="card"><table><tr><th>Week</th><th>Target</th><th>Time</th><th>Breaks</th></tr>
    ${[1,2,3,4].map(w=>{const r=D(w,5);return `<tr><td>${lbl(w)}</td><td>${DAYS[4].blocks[3].ex[0].w[w-1][1]}</td><td>${esc(r.l.d5j)||'—'}</td><td>${esc(r.breaks)||'—'}</td></tr>`}).join('')}</table></div>`;
  // shoulder log
  h+=`<div class="sect"><h3>Shoulder log</h3></div><div class="card"><div class="grid"><div></div>${DAYS.map(d=>`<div class="h">${d.short}</div>`).join('')}

  </div><p class="muted" style="font-size:12px;margin:10px 0 0">Logged from “Shoulders today” at the end of each session. If “Sore” shows up more than once in a week, go lighter on pressing and push-ups and let the doctor know.</p></div>`;
  // fitness tests

  h+=`<div class="sect"><h3>Fitness tests</h3></div><div class="card">

    ${TESTS.map(([k,l,u])=>{const a=parseFloat(S.tests.s[k]),b=parseFloat(S.tests.e[k]);let d='',good=true;if(!isNaN(a)&&!isNaN(b)&&u!=='time'){const x=b-a;d=(x>0?'+':'')+(Math.round(x*10)/10);good=k==='shuttle'?x<0:x>0;}return `<tr><td style="font-size:12px">${l}<div class="muted" style="font-size:10px">${u==='time'?'mm:ss':u}</div></td><td><input class="field" style="margin:0;padding:6px;width:64px" inputmode="${u==='time'?'text':'decimal'}" data-act="test" data-p="s" data-k="${k}" value="${tv('s',k)}"></td><td><input class="field" style="margin:0;padding:6px;width:64px" inputmode="${u==='time'?'text':'decimal'}" data-act="test" data-p="e" data-k="${k}" value="${tv('e',k)}"></td><td style="font-weight:700;color:${good?'var(--good)':'var(--muted)'}">${d}</td></tr>`}).join('')}</table>

  </div>`;
  // check-in
  const cw=S.ui.week,c=W(cw).c;
  const f=(k,l,ph,mode='decimal')=>`<div><span class="lbl">${l}</span><input class="field" style="margin-top:4px" inputmode="${mode}" placeholder="${ph}" data-act="chk" data-k="${k}" value="${esc(c[k])}"></div>`;

    <div class="row">${f('wt','Weight (kg)','e.g. 58.4')}${f('waist','Waist (cm)','at belly button')}</div>
    <div class="row">${f('hips','Hips / glutes (cm)','widest point')}${f('thigh','Thigh (cm)','mid-thigh')}</div>
    <div class="row">${f('arm','Arm (cm)','mid upper arm')}${f('sleep','Avg sleep (hrs)','e.g. 7.5')}</div>
    <label class="checkrow" style="margin-top:12px"><input type="checkbox" data-act="chkflag" data-k="photo" ${c.photo?'checked':''}> Progress photo taken (front, side, back)</label>
    <label class="checkrow" style="margin-top:8px"><input type="checkbox" data-act="chkflag" data-k="water" ${c.water?'checked':''}> Drank 2L+ water most days</label>
    <label class="checkrow" style="margin-top:8px"><input type="checkbox" data-act="chkflag" data-k="protein" ${c.protein?'checked':''}> Protein with every meal most days</label>
    <span class="lbl">Win of the week</span><input class="field" style="margin-top:4px" placeholder="e.g. first Nordic lower without collapsing!" data-act="chk" data-k="win" value="${esc(c.win)}">
  </div>`;
  const keys=[['wt','Wt'],['waist','Waist'],['hips','Hips'],['thigh','Thigh'],['arm','Arm']];
  const hasBase=Object.keys(S.base).some(k=>k!=='run'&&S.base[k]);const base=hasBase?S.base:W(1).c;
  h+=`<div class="card"><table><tr><th>Wk</th>${keys.map(k=>`<th>${k[1]}</th>`).join('')}</tr>
    ${hasBase?`<tr><td>P1</td>${keys.map(([k])=>`<td class="muted">${esc(S.base[k])||'—'}</td>`).join('')}</tr>`:''}${[1,2,3,4].map(w=>{const cc=W(w).c;return `<tr><td>${lbl(w)}</td>${keys.map(([k])=>{const v=parseFloat(cc[k]),b=parseFloat(base[k]);const d=((hasBase||w>1)&&!isNaN(v)&&!isNaN(b))?(v-b):null;return `<td>${isNaN(v)?'—':v}${d!==null&&d!==0?`<div style="font-size:11px;color:var(--muted)">${d>0?'+':''}${d.toFixed(1)}</div>`:''}</td>`}).join('')}</tr>`}).join('')}</table>
    <p class="muted" style="font-size:12px;margin:8px 0 0">Small grey numbers = change since ${hasBase?'the end of Phase 1':'Week 5'}. Switch weeks at the top to fill in each check-in.</p></div>`;
  // settings
  h+=`<div class="sect"><h3>Settings & backup</h3></div><div class="card">
    <span class="lbl" style="margin-top:0">Your name</span><input class="field" style="margin-top:4px" placeholder="First name" data-act="name" value="${esc(S.name)}">
    <span class="lbl">Theme</span><div class="seg">${['auto','light','dark'].map(t=>`<button class="${(S.theme||'auto')===t?'on':''}" data-act="theme" data-v="${t}">${t[0].toUpperCase()+t.slice(1)}</button>`).join('')}</div>
    <p class="muted" style="font-size:13px;margin:14px 0 8px">Progress is saved on this phone’s browser. Export a backup now and then, or to move to a new phone.</p>
    <div class="row"><button class="btn ghost" data-act="export">Export backup</button><button class="btn ghost" data-act="import">Import backup</button></div>
    <input type="file" id="importFile" accept="application/json,.json" style="display:none">
    <button class="btn ghost" style="margin-top:8px;color:var(--accent)" data-act="reset">Reset all progress</button>
  </div>`;
  return h;
}
function runKm(){let k=0;for(let w=1;w<=4;w++)if(D(w,4).done)k+=DAYS[3].dist[w-1];return k}

function guideView(){
  return `<div class="prose">
  <div class="card" style="margin-top:14px"><h3>Phase 2 · Weeks 5–8</h3>

  <div class="card"><h3>Suggested week</h3>
    <table><tr><td><b>Mon</b></td><td>Day 1 · Quads, glutes & abs</td></tr><tr><td><b>Tue</b></td><td>Day 2 · HIIT circuit</td></tr><tr><td><b>Wed</b></td><td>Day 3 · Shoulders, upper body & abs</td></tr><tr><td><b>Thu</b></td><td>Day 4 · Long run</td></tr><tr><td><b>Fri</b></td><td>Day 5 · Hamstrings, calves & abs</td></tr><tr><td><b>Sat/Sun</b></td><td>Rest, walk, stretch, play sport</td></tr></table></div>

    <ul><li><b>Legs:</b> 1½-rep squats, deficit split squats, single-leg hip thrusts, lateral lunges, step jumps.</li>

/* ================= EVENTS ================= */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-week],[data-day],[data-tab],[data-act],[data-goto]');if(!t)return;
  if(t.dataset.week){S.ui.week=+t.dataset.week;save();render();return}
  if(t.dataset.day){S.ui.day=+t.dataset.day;save();render();window.scrollTo({top:0});return}
  if(t.dataset.tab){S.ui.tab=t.dataset.tab;save();render();window.scrollTo({top:0});return}
  if(t.dataset.goto){const[w,d]=t.dataset.goto.split('-');S.ui.week=+w;S.ui.day=+d;S.ui.tab='train';save();render();window.scrollTo({top:0});return}
  const a=t.dataset.act,w=S.ui.week,day=DAYS[S.ui.day-1],r=D(w,day.id);
  if(t.tagName==='INPUT'&&t.type!=='checkbox')return;
  switch(a){
    case 'set':{const arr=r.s[t.dataset.id]=r.s[t.dataset.id]||[];arr[+t.dataset.i]=!arr[+t.dataset.i];maybeAutoComplete(day,w,r);break}
    case 'rpe':r.rpe=r.rpe===+t.dataset.v?null:+t.dataset.v;break;
    case 'energy':r.energy=r.energy===t.dataset.v?null:t.dataset.v;break;
    case 'shfeel':r.sh=r.sh===t.dataset.v?null:t.dataset.v;if(r.sh==='Sore')toast('Noted — go lighter on shoulder work and tell the doctor if it keeps happening');break;
    case 'done':r.done=!r.done;r.date=r.done?new Date().toLocaleDateString('en-ZA',{day:'numeric',month:'short'}):null;if(r.done)toast('Session complete — nice work!');break;
    case 'rest':runTimer([{t:'rest',d:+t.dataset.s,name:'Rest',next:'Next set'}]);return;
    case 'hold':runTimer([{t:'prep',d:5,name:'Get set',next:'Hold'},{t:'work',d:+t.dataset.s,name:'Hold',next:'Done'}]);return;
    case 'hiit':runTimer(hiitSeq(day),day);return;
    case 'theme':S.theme=t.dataset.v;applyTheme();break;
    case 'export':exportData();return;
    case 'import':$('#importFile').click();return;
    case 'reset':if(confirm('Reset ALL Phase 2 progress? This cannot be undone (export a backup first).')){S={name:S.name,theme:S.theme,w:{},base:{},tests:{s:{},e:{}},ui:{week:1,day:1,tab:'train'}};toast('Progress reset')}break;
    default:return;
  }
  save();render();
});
document.addEventListener('change',e=>{
  const t=e.target;if(t.id==='importFile'){importData(t.files[0]);return}
  const a=t.dataset.act;if(!a)return;
  const w=S.ui.week,day=DAYS[S.ui.day-1],r=D(w,day.id);
  if(a==='flag')r[t.dataset.k]=t.checked;
  else if(a==='runflag')r[t.dataset.k]=t.checked;
  else if(a==='chkflag')W(w).c[t.dataset.k]=t.checked;
  else return;
  save();
});
document.addEventListener('input',e=>{
  const t=e.target,a=t.dataset.act;if(!a)return;
  const w=S.ui.week,day=DAYS[S.ui.day-1],r=D(w,day.id),v=t.value;
  if(a==='load')r.l[t.dataset.id]=v;
  else if(a==='fin')r.breaks=v;
  else if(a==='note')r.n=v;
  else if(a==='run'){r[t.dataset.k]=v.replace(/\D/g,'');const p=paceOf(r.min,r.sec,day.dist[w-1]);const el=$('#pace');if(el)el.textContent=p?p+' /km':'—'}
  else if(a==='chk')W(w).c[t.dataset.k]=v;
  else if(a==='base')S.base[t.dataset.k]=v;
  else if(a==='test')S.tests[t.dataset.p][t.dataset.k]=v;
  else if(a==='name'){S.name=v.trim();$('#hello').textContent=S.name?`Let’s go, ${S.name}`:'Weeks 5–8'}
  save();
});
function maybeAutoComplete(day,w,r){
  const p=dayProgress(day,w);
  if(p.done===p.tot&&!r.done){toast('All sets ticked — mark it complete below!')}
}
function exportData(){
  const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`athlete-build-phase2-backup-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a);a.click();a.remove();toast('Backup downloaded');
}
function importData(file){
  if(!file)return;const fr=new FileReader();
  fr.onload=()=>{try{const d=JSON.parse(fr.result);if(!d||typeof d.w!=='object')throw 0;S=d;S.ui=S.ui||{week:1,day:1,tab:'progress'};S.base=S.base||{};S.tests=S.tests||{s:{},e:{}};save();applyTheme();render();toast('Backup restored')}catch(e){toast('That file isn’t a valid backup')}};
  fr.readAsText(file);
}
function applyTheme(){const r=document.documentElement;if(!S.theme||S.theme==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',S.theme)}

/* ================= TIMER ================= */
let T=null,actx=null,wake=null;
function beep(f=880,d=.12,v=.25){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=f;o.type='square';g.gain.value=v;o.connect(g);g.connect(actx.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+d);o.stop(actx.currentTime+d+.02)}catch(e){}}
function buzz(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
function hiitSeq(day){
  const seq=[{t:'prep',d:10,name:'Get ready',next:day.ex[0].name,r:1}];
  for(let r=0;r<day.rounds;r++){
    day.ex.forEach((e,i)=>{
      seq.push({t:'work',d:day.work,name:e.name,r:r+1,id:e.id,next:i<day.ex.length-1?day.ex[i+1].name:(r<day.rounds-1?'Round rest':'Finished!')});
      const last=i===day.ex.length-1;
      if(!last)seq.push({t:'rest',d:day.rest,name:'Rest',r:r+1,next:day.ex[i+1].name});
      else if(r<day.rounds-1)seq.push({t:'rest',d:day.roundRest,name:'Round rest',r:r+1,next:'Round '+(r+2)+': '+day.ex[0].name});
    });
  }
  return seq;
}
async function runTimer(seq,day){
  beep(660,.05,.01);// unlock audio on tap
  try{wake=await navigator.wakeLock?.request('screen')}catch(e){}
  T={seq,i:0,day,paused:false,left:seq[0].d,end:Date.now()+seq[0].d*1000,last:null,total:seq.length};
  $('#timer').classList.remove('hidden');showStep();
  clearInterval(T.iv);T.iv=setInterval(tick,150);
}
function showStep(){
  const s=T.seq[T.i],el=$('#timer');
  el.className='timer '+(s.t==='work'?'work':s.t==='rest'?'rest':'');
  $('#tPh').textContent=s.t==='work'?'Work':s.t==='rest'?'Rest':'Get ready';
  $('#tNm').textContent=s.name;
  $('#tNx').textContent=s.next?'Next: '+s.next:'';
  $('#tRd').textContent=T.day?`Round ${s.r} of ${T.day.rounds} · ${T.i+1}/${T.total}`:'';
  $('#tPause').textContent='Pause';
}
function tick(){
  if(!T||T.paused)return;
  const s=T.seq[T.i],ms=T.end-Date.now(),sec=Math.ceil(ms/1000);
  $('#tCt').textContent=Math.max(0,sec);
  $('#tBar').style.width=Math.min(100,(1-ms/(s.d*1000))*100)+'%';
  if(sec!==T.last&&sec<=3&&sec>0){beep(700);}
  T.last=sec;
  if(ms<=0)advance(true);
}
function advance(completed){
  const s=T.seq[T.i];
  if(completed&&s.t==='work'&&s.id){const r=D(S.ui.week,T.day.id);const arr=r.s[s.id]=r.s[s.id]||[];arr[s.r-1]=true;save()}
  T.i++;
  if(T.i>=T.seq.length){beep(1200,.4);buzz([200,100,200,100,400]);finishTimer(true);return}
  const n=T.seq[T.i];beep(n.t==='work'?1100:500,.25);buzz(n.t==='work'?[250]:[120,80,120]);
  T.end=Date.now()+n.d*1000;T.last=null;showStep();
}
function finishTimer(done){
  clearInterval(T&&T.iv);$('#timer').classList.add('hidden');
  try{wake&&wake.release()}catch(e){}wake=null;
  if(done&&T&&T.day)toast('Circuit done — log your effort below!');
  T=null;render();
}
$('#tPause').onclick=()=>{if(!T)return;if(T.paused){T.end=Date.now()+T.rem;T.paused=false;$('#tPause').textContent='Pause'}else{T.rem=T.end-Date.now();T.paused=true;$('#tPause').textContent='Resume'}};
$('#tSkip').onclick=()=>{if(T)advance(false)};
$('#tStop').onclick=()=>finishTimer(false);
document.addEventListener('visibilitychange',async()=>{if(T&&document.visibilityState==='visible'){try{wake=await navigator.wakeLock?.request('screen')}catch(e){}}});

applyTheme();render();
</script>
